name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to build, e.g. v1.2.3'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-22.04
    env:
      # The launcher version comes from the tag rather than from the checked out git state, so the
      # build does not depend on tags being fetched. See resolveCm2Version in build.gradle.
      CM2_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Validate the version tag
        run: |
          if ! echo "$CM2_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$CM2_VERSION' is not a v<major>.<minor>.<patch> tag"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Write the release keystore
        env:
          CM2_KEYSTORE_BASE64: ${{ secrets.CM2_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CM2_KEYSTORE_BASE64" ]; then
            echo "::error::the CM2_KEYSTORE_BASE64 secret is not set, the APK would not be signed"
            exit 1
          fi
          # tolerate line breaks/whitespace that shells and editors like to add to the secret
          printf '%s' "$CM2_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > app_pojavlauncher/cm2_release.jks
          if [ ! -s app_pojavlauncher/cm2_release.jks ]; then
            echo "::error::decoded keystore is empty, check the CM2_KEYSTORE_BASE64 secret"
            exit 1
          fi

      - name: Build the release APK
        env:
          CM2_KEYSTORE_PASSWORD: ${{ secrets.CM2_KEYSTORE_PASSWORD }}
          CM2_KEY_ALIAS: ${{ secrets.CM2_KEY_ALIAS }}
          CM2_KEY_PASSWORD: ${{ secrets.CM2_KEY_PASSWORD }}
        run: gradle :app_pojavlauncher:assembleFullRelease --console=plain

      - name: Verify the APK
        run: |
          # An unsigned build would be named app_pojavlauncher-full-release-unsigned.apk instead.
          APK=app_pojavlauncher/build/outputs/apk/full/release/app_pojavlauncher-full-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::signed APK not found, the release build produced: $(ls app_pojavlauncher/build/outputs/apk/full/release/)"
            exit 1
          fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          # The LTW renderer comes from a prebuilt AAR in app_pojavlauncher/libs; make sure a
          # missing or stale one does not silently ship a launcher without libltw.so.
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libltw.so' || {
            echo "::error::libltw.so is missing from the APK"
            exit 1
          }
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep '^package'
          mkdir -p out
          cp "$APK" "out/CounterMine2-$CM2_VERSION.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CM2_VERSION }}
          name: CounterMine 2 ${{ env.CM2_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: out/CounterMine2-${{ env.CM2_VERSION }}.apk
