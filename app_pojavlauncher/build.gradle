plugins {
    id 'com.android.application' version '8.11.1'
    id 'de.undercouch.download' version '5.6.0'
    id 'org.ajoberstar.grgit' version '5.3.2'
}

apply from: rootProject.file('gradle/prefab_bypass.gradle')

import de.undercouch.gradle.tasks.download.Download

// cm2android: the launcher version comes from the newest v<major>.<minor>.<patch> git tag.
// versionCode is derived from that semver, and the in-app updater re-derives it from the tag of
// the latest GitHub release, so both sides must keep this mapping in sync.
static def parseSemver(String tagName) {
    if (tagName == null) return null
    def matcher = (tagName.trim() =~ /^v?(\d+)\.(\d+)\.(\d+)$/)
    if (!matcher.matches()) return null
    return [matcher.group(1) as int, matcher.group(2) as int, matcher.group(3) as int]
}

static def semverToCode(List semver) {
    return semver[0] * 10000 + semver[1] * 100 + semver[2]
}

// Resolves the version as [code: int, name: String].
// Priority: explicit override (CI tag builds) -> newest semver tag -> development fallback.
def resolveCm2Version = {
    def override = System.getenv("CM2_VERSION") ?: findProperty("cm2Version")
    if (override != null && !override.toString().trim().isEmpty()) {
        def semver = parseSemver(override.toString())
        if (semver != null) return [code: semverToCode(semver), name: semver.join('.')]
        logger.warn("BUILD: CM2 version override '${override}' is not a v<major>.<minor>.<patch> tag, ignoring it")
    }

    def newestSemver = null
    def newestTag = null
    try {
        grgit.tag.list().each { tag ->
            def semver = parseSemver(tag.name)
            if (semver == null) return
            if (newestSemver == null || semverToCode(semver) > semverToCode(newestSemver)) {
                newestSemver = semver
                newestTag = tag
            }
        }
    } catch (Exception e) {
        logger.warn("BUILD: unable to read git tags (${e.message}), falling back to a development version")
    }

    // No release tag yet: use the lowest possible code so that any published release wins.
    if (newestSemver == null) return [code: 1, name: "0.0.0-dev"]

    def versionName = newestSemver.join('.')
    try {
        def head = grgit.head()
        // Commits past the tag are development builds. They keep the released version code so
        // that the updater does not offer an update to the release this build is already based on.
        if (head.id != newestTag.commit.id) versionName = "${versionName}-dev-${head.abbreviatedId}"
    } catch (Exception ignored) {
        versionName = "${versionName}-dev"
    }
    return [code: semverToCode(newestSemver), name: versionName]
}

def cm2Version = resolveCm2Version()

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY")
    if(key != null) return key
    File curseforgeKeyFile = new File("./curseforge_key.txt")
    if(curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text
    }
    logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !')
    return "DUMMY"
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'git.artdeell.mojo'

    compileSdk = 36

    lintOptions {
        abortOnError false
    }

    signingConfigs {
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        googlePlayBuild {
            storeFile file("mojo_upload_next.jks")
            storePassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
            keyAlias "key0"
            keyPassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
        }
        publicBuild {
            storeFile file("mojo_release_next.jks")
            storePassword System.getenv("MOJOPUB_KEYSTORE_PASSWORD")
            keyAlias "key0"
            keyPassword System.getenv("MOJOPUB_KEYSTORE_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "dev.cherrypizza.cm2android"
        // cm2android: preconfigured CounterMine server + Fabric build id
        buildConfigField "String", "CM2_SERVER_ADDRESS", '"android.cherry.pizza"'
        buildConfigField "String", "CM2_VERSION_ID", '"fabric-loader-0.19.3-26.2"'
        // GitHub repository the in-app updater polls for new releases
        buildConfigField "String", "CM2_UPDATE_REPO", '"SkolkovoLab/cm2android"'
        minSdkVersion 21
        targetSdkVersion 36
        versionCode cm2Version.code
        versionName cm2Version.name
        multiDexEnabled false //important
        resValue 'string', 'curseforge_api_key', getCFApiKey()
        resValue 'string', 'group_id', 'git.artdeell'
    }

    flavorDimensions  = ["runtime"]
    
    productFlavors {
        full {
            dimension "runtime"
        }
        
        noruntime {
            dimension "runtime"
            versionNameSuffix "-noruntime"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customDebug
            resValue 'string', 'application_package', 'dev.cherrypizza.cm2android.debug'
            resValue 'string', 'storageProviderAuthorities', 'dev.cherrypizza.cm2android.scoped.gamefolder.debug'
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
            matchingFallbacks += List.of("debug")
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            // Don't set to true or java.awt will be a.a or something similar.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // defaultConfig already set
            // multiDexEnabled = true
            // debuggable = true
            resValue 'string', 'storageProviderAuthorities', 'dev.cherrypizza.cm2android.scoped.gamefolder'
            resValue 'string', 'application_package', 'dev.cherrypizza.cm2android'
        }
        gplay {
            initWith release
            signingConfig signingConfigs.googlePlayBuild
            matchingFallbacks += List.of("release")
        }
        pubRelease {
            initWith release
            signingConfig signingConfigs.publicBuild
            matchingFallbacks += List.of("release")
        }
    }

    ndkVersion "29.0.14206865"

    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        pickFirst '**/libbytehook.so'
    }

    buildFeatures {
        buildConfig true
    }
}

class AssetTaskRegistrar {
    private Project project
    private Task mergeAssetsTask
    private File targetAssetsDir
    private String variantName
    private File targetDownloadDir
    private File projectJarDir

    AssetTaskRegistrar(Project project) {
        this.project = project

        targetDownloadDir = new File(project.projectDir, "build/intermediates/download_deps")
        projectJarDir = new File(project.projectDir, "build/intermediates/package_jar_deps")
        createDirectories targetDownloadDir
        createDirectories projectJarDir
    }

    def setVariant(variant) {
        variantName = variant.getName().capitalize()
        mergeAssetsTask = variant.getPreBuildProvider().get()

        targetAssetsDir = new File(project.projectDir, "build/intermediates/remote_asset_set/${variantName.toLowerCase()}/")
        createDirectories(targetAssetsDir)

        project.android.sourceSets[variant.getName()].assets.srcDirs += targetAssetsDir.absolutePath
    }

    static def createDirectories(File location) {
        if(!location.isDirectory() && !location.mkdirs())
            throw new RuntimeException("Failed to create directory "+location.getAbsolutePath())
    }

    static def writeVersion(File dir) {
        File versionFile = new File(dir, "version")
        versionFile.write(String.valueOf(new Date().getTime()))
    }

    private def assetDestination(String relativePath) {
        return new File(targetAssetsDir, relativePath)
    }

    private def onlineUnzipTask(String downloadUrl, String name, File targetExtractionDir) {
        createDirectories targetExtractionDir

        def downloadTarget = new File(targetDownloadDir, name)

        def dependencySuffix = "${name}${variantName}"
        def downloadTask = project.tasks.register("download${dependencySuffix}", Download) {
            src downloadUrl
            dest downloadTarget
            overwrite false
        }

        def unzipTask = project.tasks.register("unzip${dependencySuffix}", Copy) {
            from project.zipTree(downloadTarget)
            into targetExtractionDir
            dependsOn downloadTask
        }
        return unzipTask
    }

    def onlineZipDependency(String downloadUrl, String name, String relativePath) {
	    mergeAssetsTask.dependsOn(onlineUnzipTask downloadUrl, name, assetDestination(relativePath))
    }

    def projectJarDependency(Project project, String relativePath) {
        def assetTargetDir = assetDestination(relativePath)
        def jarTargetDir = new File(projectJarDir, relativePath)
        createDirectories assetTargetDir
        createDirectories jarTargetDir

        def copyTaskName = "copyProjectJar${jarTargetDir.getName()}${variantName}"
        def copyTask = project.tasks.register(copyTaskName, Copy) {
            from jarTargetDir
            into assetTargetDir
            // Nasty hack: explicitly reference project by name to force Gradle to configure it.
            // Makes jar task search below work properly for fresh configurations.
            dependsOn ":${project.name}:jar"
        }

        mergeAssetsTask.dependsOn copyTask

        project.tasks.withType(org.gradle.jvm.tasks.Jar.class).configureEach {
            it.destinationDirectory = jarTargetDir
            doLast {
                if(!it.didWork) return
                writeVersion jarTargetDir
            }
        }
    }

    def onlineJarDependency(String jarUrl, String jarProject, String dependency, String version, String suffix,  String relativePath) {
        File targetDir = assetDestination(relativePath)
        createDirectories targetDir
        def dependencySuffix = "${jarProject}${dependency}${variantName}"
        def downloadTask = project.tasks.register("download${dependencySuffix}", Download) {
            src String.format(jarUrl, jarProject, dependency, version, suffix)
            dest targetDir
            overwrite false
            doLast {
                if(!it.didWork) return
                writeVersion targetDir
            }
        }
        mergeAssetsTask.dependsOn(downloadTask)
    }

    def jreRuntimeDependency(int version, String relPath) {
        def jreUrl = "https://github.com/MojoLauncher/android-openjdk-build-multiarch/releases/download/rolling/jre%d-pojav.zip"
        onlineZipDependency(String.format(jreUrl, version), "ComponentRuntime$version", relPath)
    }
}

afterEvaluate {
    def registrar = new AssetTaskRegistrar(project)

    android.applicationVariants.configureEach { variant ->
        registrar.setVariant(variant)

        registrar.projectJarDependency project(":forge_installer"), "components/forge_installer"

		if (variant.getName().toLowerCase().contains("full")) {
            registrar.jreRuntimeDependency 8, "components/jre"
        }
        
		def cacioJarUrl = "https://jitpack.io/com/github/MojoLauncher/%1\$s/%2\$s/%3\$s/%2\$s-%3\$s%4\$s.jar"

        registrar.onlineJarDependency cacioJarUrl, "caciocavallo", "cacio-shared", "-01d2dc1d65-1", "", "components/caciocavallo"
        registrar.onlineJarDependency cacioJarUrl, "caciocavallo", "cacio-androidnw", "-01d2dc1d65-1", "", "components/caciocavallo"

        registrar.onlineJarDependency cacioJarUrl, "caciocavallo17", "cacio-tta", "72a9ab6323", "-jar-with-dependencies", "components/caciocavallo17"
    }
}

